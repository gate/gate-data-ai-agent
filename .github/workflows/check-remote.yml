name: check-remote

# Verify public raw.githubusercontent.com URLs used by curl bootstrap.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  check-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub raw URLs
        run: bash scripts/check-remote.sh
